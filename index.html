<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1018"><title>Air Music Vision</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#0d1018;color:#f5f6fa;font-family:system-ui,sans-serif}header,.controls,.panel{padding:16px}h1{margin:0;font-size:28px}.sub,.hint{color:#aeb6ca}.controls{display:flex;gap:8px;flex-wrap:wrap}button{background:#20283a;color:white;border:1px solid #46536f;border-radius:10px;padding:12px 15px;font-weight:700}button.on{background:#395a9e}.stage{position:relative;margin:8px auto;width:min(96vw,900px);aspect-ratio:16/10;background:#111725;border-radius:18px;overflow:hidden;border:1px solid #303b55}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{z-index:2}.status{position:absolute;z-index:4;left:12px;top:12px;background:#0b0e15cc;padding:8px;border-radius:10px}.instrument,.panel{width:min(96vw,900px);margin:12px auto}.keys,.frets{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}.key{height:155px;background:#f1f2f5;color:#171a22;border-radius:0 0 9px 9px;display:flex;align-items:flex-end;justify-content:center;padding:8px;font-weight:800}.key.hit,.fret.hit{background:#789bea}.guitar{display:none;background:#39291f;border:2px solid #7b5b42;border-radius:20px;padding:30px 4px}.guitar.show{display:block}.fret{border-right:2px solid #9a7658;text-align:center;padding:30px 2px;font-weight:800}.panel{background:#151b29;border:1px solid #303b55;border-radius:14px}.target{font-size:38px;color:#ffd76a;font-weight:800}</style></head><body><header><h1>AIR MUSIC VISION</h1><div class="sub">Piano + guitarra tocados no ar com visão computacional</div></header><div class="controls"><button id="start">Ativar câmera</button><button data-mode="piano" class="on">🎹 Piano</button><button data-mode="guitar">🎸 Guitarra</button><button id="challenge">🎯 Desafio</button></div><div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div class="status" id="status">Câmera desligada</div></div><div class="instrument"><div class="keys" id="keys"></div><div class="guitar" id="guitar"><div class="frets" id="frets"></div></div></div><div class="panel"><div id="challengeUI">Modo livre</div><p class="hint">Piano: desça o indicador como se pressionasse uma tecla. Guitarra: uma mão escolhe a nota e a outra faz a palhetada.</p><label>Sensibilidade <input id="sens" type="range" min="5" max="45" value="18"></label></div><script type="module">import{HandLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm";const N=["DÓ","RÉ","MI","FÁ","SOL","LÁ","SI","DÓ"],F=[261.63,293.66,329.63,349.23,392,440,493.88,523.25],v=document.querySelector("#video"),c=document.querySelector("#canvas"),x=c.getContext("2d"),st=document.querySelector("#status"),keys=document.querySelector("#keys"),guitar=document.querySelector("#guitar"),frets=document.querySelector("#frets");N.forEach((n,i)=>{keys.innerHTML+=`<div class="key" data-i="${i}">${n}</div>`;frets.innerHTML+=`<div class="fret" data-i="${i}">${n}</div>`});let mode="piano",challenge=false,target=0,score=0,combo=0,last=new Map(),lp=0,lm,audio;function tone(i,t){if(Date.now()-lp<90)return;lp=Date.now();audio??=new AudioContext;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=F[i];o.type=t==="guitar"?"sawtooth":"triangle";g.gain.setValueAtTime(.18,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.55);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.6);let e=document.querySelector((mode==="piano"?".key":".fret")+`[data-i="${i}"]`);e.classList.add("hit");setTimeout(()=>e.classList.remove("hit"),150);if(challenge){if(i===target){combo++;score+=100*combo;target=Math.floor(Math.random()*8)}else combo=0;ui()}}function ui(){document.querySelector("#challengeUI").innerHTML=challenge?`Toque: <span class="target">${N[target]}</span> · Pontos ${score} · Combo x${combo}`:"Modo livre"}document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(q=>q.classList.toggle("on",q===b));keys.style.display=mode==="piano"?"grid":"none";guitar.classList.toggle("show",mode==="guitar")});document.querySelector("#challenge").onclick=()=>{challenge=!challenge;score=combo=0;target=Math.floor(Math.random()*8);ui()};document.querySelector("#start").onclick=async()=>{try{audio??=new AudioContext;const vis=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm");lm=await HandLandmarker.createFromOptions(vis,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},runningMode:"VIDEO",numHands:2,minHandDetectionConfidence:.55,minTrackingConfidence:.5});v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});await v.play();requestAnimationFrame(loop)}catch(e){st.textContent="Erro na câmera: "+e.message}};function loop(){if(!lm||v.readyState<2){requestAnimationFrame(loop);return}c.width=v.videoWidth;c.height=v.videoHeight;x.clearRect(0,0,c.width,c.height);let r=lm.detectForVideo(v,performance.now()),hs=[];r.landmarks.forEach((p,k)=>{let h=r.handednesses?.[k]?.[0]?.categoryName||String(k),cx=p.reduce((a,z)=>a+z.x,0)/p.length,cy=p.reduce((a,z)=>a+z.y,0)/p.length;hs.push({p,h,cx,cy});x.strokeStyle="#76e0c5";x.lineWidth=3;p.forEach(z=>{x.beginPath();x.arc((1-z.x)*c.width,z.y*c.height,4,0,7);x.stroke()})});let th=Number(document.querySelector("#sens").value)/1000;if(mode==="piano")hs.forEach(h=>{let p=h.p[8],i=Math.max(0,Math.min(7,Math.floor(p.x*8))),old=last.get(h.h)??p.y,dy=p.y-old;last.set(h.h,p.y);if(p.y>.34&&dy>th)tone(i,"piano")});else if(hs.length>=2){hs.sort((a,b)=>a.cx-b.cx);let f=hs[0],s=hs.at(-1),i=Math.max(0,Math.min(7,Math.floor((f.cx/.65)*8))),old=last.get("s")??s.cy,dy=s.cy-old;last.set("s",s.cy);if(Math.abs(dy)>th*1.45)tone(i,"guitar")}st.textContent=`Visão ativa · ${hs.length} mão(s) · ${mode}`;requestAnimationFrame(loop)}</script></body></html>
